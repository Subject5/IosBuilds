name: Build IPA
on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Seleccionar versión de Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Compilar Proyecto
        run: |
          xcodebuild archive \
            -project fnis-0.0.3.alpha.xcodeproj \
            -scheme FNiS \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO

      - name: Generar IPA (Unsigned)
        run: |
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/*.app build/Payload
          cd build && zip -r fnis.ipa Payload

      - name: Subir IPA como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: fnis-artifact
          path: build/fnis.ipa
