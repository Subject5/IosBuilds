name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🛠️ Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: 📦 Install dependencies (si usas CocoaPods)
        run: |
          if [ -f "Podfile" ]; then
            sudo gem install cocoapods
            pod install
          fi

      - name: 🏗️ Archive
        run: |
          xcodebuild \
            -scheme "fnis-0.0.3.alpha" \
            -configuration Release \
            -archivePath $PWD/build/fnis.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: 📤 Export IPA
        run: |
          mkdir -p build/export

          cat > exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>ad-hoc</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive 
            -archivePath $PWD/build/fnis.xcarchive 
            -exportOptionsPlist exportOptions.plist 
            -exportPath $PWD/build/export

      - name: 📦 (Opcional) Remove signature
        run: |
          cd build/export
          unzip .ipa -d extracted
          cd extracted/Payload/.app
          codesign --remove-signature . || true
          cd ../../
          zip -r fnis-unsigned.ipa Payload

      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fnis-ipa
          path: build/export/*.ipa
